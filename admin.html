  .topbar { background:linear-gradient(135deg,#b91c1c,#7f1d1d 55%,#14532d); color:#fff; padding:18px 32px; }
  .topbar-title { font-size:19px; font-weight:800; display:flex; align-items:center; gap:10px; }
  .topbar-title svg { width:26px; height:26px; flex-shrink:0; }

  .container { max-width:1180px; margin:0 auto; padding:28px 24px 60px; }

  .top-grid { display:grid; grid-template-columns:1fr 260px; gap:20px; margin-bottom:24px; align-items:start; }
  @media (max-width:820px) { .top-grid { grid-template-columns:1fr; } }

  .stat-grid { display:flex; flex-direction:column; gap:14px; }
  .stat-row { display:grid; gap:14px; }
  .stat-card { background:#fff; border-radius:14px; padding:16px 18px; border:1px solid #eadfd3; }
  .stat-value { font-size:24px; font-weight:800; color:#7f1d1d; }
  .stat-label { font-size:12px; color:#6b7280; margin-top:2px; }

  .qr-card { background:#fff; border-radius:14px; border:1px solid #eadfd3; padding:18px; text-align:center; }
  .qr-card-title { font-size:12.5px; font-weight:700; color:#374151; margin-bottom:10px; display:flex; align-items:center; justify-content:center; gap:6px; }
  .qr-card-title svg { width:15px; height:15px; }
  #qr-holder { display:flex; justify-content:center; margin-bottom:8px; }
  .qr-url { font-size:10.5px; color:#9ca3af; word-break:break-all; }

  .toolbar { display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .toolbar-btn-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .search-field { flex:1; min-width:180px; display:flex; align-items:center; gap:8px; background:#fff; border:1.5px solid #eadfd3; border-radius:10px; padding:9px 14px; }
  .search-field svg { width:16px; height:16px; color:#9ca3af; flex-shrink:0; }
  .search-field input { border:none; outline:none; font-size:14px; flex:1; color:#7f1d1d; }
  .btn { padding:9px 16px; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer; border:none; transition:all .2s; white-space:nowrap; display:inline-flex; align-items:center; gap:6px; }
  .btn svg { width:15px; height:15px; }
  .btn-dark { background:#14532d; color:#fff; }
  .btn-dark:hover { background:#b91c1c; }
  .btn-ghost { background:#fff; color:#374151; border:1.5px solid #eadfd3; }
  .btn-ghost:hover { background:#fdf2f2; }

  .table-wrap { background:#fff; border-radius:14px; border:1px solid #eadfd3; overflow:hidden; }
  table { width:100%; border-collapse:collapse; table-layout:auto; }
  thead th { background:#fbf6f1; padding:12px 16px; font-size:12px; font-weight:700; color:#6b7280; text-align:left; text-transform:uppercase; letter-spacing:.5px; border-bottom:1px solid #eadfd3; white-space:nowrap; }
  tbody td { padding:13px 16px; font-size:14px; color:#374151; border-bottom:1px solid #f5ede6; vertical-align:middle; }
  tbody tr:last-child td { border-bottom:none; }
  .empty-table { text-align:center; color:#9ca3af; padding:48px 20px; }

  .opcion-chip { display:inline-block; padding:3px 11px; border-radius:999px; font-size:11.5px; font-weight:700; white-space:nowrap; }

  .row-actions { display:flex; gap:6px; }
  tr.main-row { cursor:pointer; }
  tr.main-row:hover { background:#fdf8f4; }
  thead th:nth-child(1), tr.main-row td:nth-child(1) { padding-right:24px; }
  thead th:nth-child(2), tr.main-row td:nth-child(2) { width:1%; white-space:nowrap; padding-left:8px; padding-right:12px; padding-top:4px; padding-bottom:4px; }
  tr.detail-row.hidden { display:none; }
  tr.detail-row td { background:#fdf8f4; padding:10px 16px 14px; font-size:12.5px; color:#6b7280; border-bottom:1px solid #f5ede6; }
  tr.detail-row .detail-item { display:inline-block; margin-right:18px; }
  tr.detail-row .detail-item b { color:#374151; font-weight:700; }
  .btn-icon { width:26px; height:26px; border-radius:7px; border:1.5px solid #e5e7eb; background:#fff; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; transition:all .15s; }
  .btn-icon:hover { background:#f3f4f6; }
  .btn-icon.danger:hover { background:#fee2e2; border-color:#fca5a5; }
  .btn-icon svg { width:16px; height:16px; stroke:#374151; }
  .btn-icon.danger svg { stroke:#dc2626; }

  /* ── MODALES ── */
  .modal-overlay { position:fixed; inset:0; background:rgba(15,23,42,.55); display:none; align-items:center; justify-content:center; z-index:2000; padding:20px; }
  .modal-overlay.show { display:flex; }
  .modal-card { background:#fff; border-radius:16px; width:100%; max-width:420px; padding:26px; box-shadow:0 25px 60px rgba(0,0,0,.3); }
  .modal-card h3 { font-size:17px; font-weight:800; color:#7f1d1d; margin-bottom:16px; }
  .modal-actions { display:flex; gap:10px; margin-top:18px; }
  .modal-actions .btn { flex:1; padding:11px; justify-content:center; }
  .modal-msg { font-size:15px; color:#374151; line-height:1.5; margin-bottom:6px; }

  #app-toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px);
    background:#14532d; color:#fff; padding:12px 22px; border-radius:12px; font-size:14px; font-weight:500;
    box-shadow:0 8px 24px rgba(0,0,0,.2); z-index:9000; opacity:0; transition:opacity .25s,transform .25s;
    white-space:nowrap; pointer-events:none; max-width:90vw; text-align:center; }
  #app-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #app-toast.toast-error { background:#dc2626; }
</style>
</head>

<div class="topbar">
  <div class="topbar-title">
    <svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="20" y="6" width="26" height="10" rx="3" fill="rgba(255,255,255,.95)" stroke="none"/>

<div class="container" id="zoom-root">

  <div class="top-grid">

      </div>

    <div class="qr-card">
      <div class="qr-card-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>

      </div>
      <div id="qr-holder"></div>
      <div class="qr-url" id="qr-url"></div>

  </div>

  <div class="toolbar">
    <div class="toolbar-btn-row">
      <button class="btn btn-dark" onclick="exportExcel()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Exportar Excel
      </button>
      <button class="btn btn-ghost" onclick="loadList()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Actualizar
      </button>
      <button class="btn btn-ghost" id="toggle-edit-btn" onclick="toggleModifyMode()"></button>
    </div>
    <div class="search-field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search" placeholder="Buscar" oninput="filterList()">
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Nombre</th>
        <th></th>
      </tr></thead>
      <tbody id="list-tbody">
        <tr><td colspan="2" class="empty-table">Cargando…</td></tr>
      </tbody>
    </table>
  </div>

</div>

<!-- MODAL ELIMINAR -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal-card">
    <h3>¿Eliminar esta confirmación?</h3>
    <div class="modal-msg" id="delete-msg"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeDeleteConfirm()">Cancelar</button>
      <button class="btn" style="background:#dc2626;color:#fff;" id="delete-confirm-btn" onclick="confirmDelete()">Eliminar</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="app-toast"></div>

<script>
// ============================================================
//  CONFIGURACIÓN — debe coincidir con nav.html.
//  Reutiliza la tabla del viaje a la playa; todos son de Heredia.
// ============================================================
const CONFIG = {
  tabla: 'viaje_playa_rsvp',
  titulo: 'Participación — Bota navideña',
  formUrl: 'https://alquemis.github.io/nav/',   // [Pendiente] URL pública del formulario
  archivoExcel: 'participacion_bota_navidena.xlsx'
};

const SUPABASE_URL = 'https://jdifschnvycvxlcbexdl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpkaWZzY2hudnljdnhsY2JleGRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4Njk0ODcsImV4cCI6MjEwMzQ0NTQ4N30.sUfYan-cWLmFdSFh8mciFHlVin8Z7Pib8m3zcZIepJw';
// Si la librería no cargó (sin conexión), la página igual muestra su contenido.
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const ICON_DONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

let allRows = [];

let _toastTimer = null;
function showToast(msg, type) {
  const t = document.getElementById('app-toast');
  t.textContent = msg;
  t.className = 'show' + (type === 'error' ? ' toast-error' : '');
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { t.className = ''; }, 3500);
}

function esc(s) {
  return String(s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

// Textos, encabezados y tarjetas de estadística desde CONFIG
(function renderConfig() {
  document.getElementById('topbar-title').textContent = CONFIG.titulo;
  document.getElementById('toggle-edit-btn').innerHTML = ICON_EDIT + ' Editar';
})();

// Al tocar una fila se revela (o se oculta) el detalle con cédula, teléfono
// y fecha de confirmación — quedan ocultos por defecto para una vista más limpia.
function toggleRowDetail(id) {
  const row = document.getElementById('detail-' + id);
  if (row) row.classList.toggle('hidden');
}

async function loadList(silent) {
  if (!sb) return;
  if (!silent) document.getElementById('list-tbody').innerHTML = '<tr><td colspan="2" class="empty-table">Cargando…</td></tr>';
  const { data, error } = await sb.from(CONFIG.tabla).select('*').order('created_at', { ascending: false });
  if (error) { console.error(error); showToast('Error al cargar: ' + error.message, 'error'); return; }
  allRows = data || [];
  updateStats();
  filterList();
}

function updateStats() {
  document.getElementById('stat-total').textContent = allRows.length;
}

function filterList() {
  const q = document.getElementById('search').value.toLowerCase();
  const list = allRows.filter(r =>
    !q || (r.nombre||'').toLowerCase().includes(q) || (r.cedula||'').toLowerCase().includes(q)
  );
  renderList(list);
}

function renderList(list) {
  const tbody = document.getElementById('list-tbody');
  if (list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="2" class="empty-table">Sin confirmaciones todavía</td></tr>';
    applyZoom();
    return;
  }
  tbody.innerHTML = list.map(r => {
    const fecha = r.created_at ? new Date(r.created_at).toLocaleDateString('es-CR', { day:'2-digit', month:'2-digit', year:'numeric' }) : '—';
    const trashBtn = _modifyMode
      ? '<button class="btn-icon danger" title="Eliminar" onclick="openDeleteConfirm(' + r.id + ')"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>'
      : '';
    return '<tr class="main-row" onclick="toggleRowDetail(' + r.id + ')">' +
      '<td>' + esc(r.nombre||'—') + '</td>' +
      '<td><div class="row-actions" onclick="event.stopPropagation()">' + trashBtn + '</div></td>' +
    '</tr>' +
    '<tr class="detail-row hidden" id="detail-' + r.id + '">' +
      '<td colspan="2">' +
        '<span class="detail-item"><b>Cédula:</b> ' + esc(r.cedula||'—') + '</span>' +
        '<span class="detail-item"><b>Confirmado el:</b> ' + fecha + '</span>' +
      '</td>' +
    '</tr>';
  }).join('');
  applyZoom();
}

// ── MODO EDITAR (activa la papelera por fila) ──────────────────
let _modifyMode = false;
function toggleModifyMode() {
  _modifyMode = !_modifyMode;
  document.getElementById('toggle-edit-btn').innerHTML = _modifyMode ? ICON_DONE + ' Listo' : ICON_EDIT + ' Editar';
  filterList();
}

// ── ELIMINAR ──────────────────────────────────────────────────
let _deletingId = null;
function openDeleteConfirm(id) {
  const r = allRows.find(x => x.id === id);
  if (!r) return;
  _deletingId = id;
  document.getElementById('delete-msg').textContent = 'Se eliminará la confirmación de ' + (r.nombre || 'esta persona') + '.';
  document.getElementById('delete-modal').classList.add('show');
}
function closeDeleteConfirm() {
  document.getElementById('delete-modal').classList.remove('show');
  _deletingId = null;
}
async function confirmDelete() {
  if (!_deletingId) return;
  const btn = document.getElementById('delete-confirm-btn');
  btn.disabled = true; btn.textContent = 'Eliminando…';
  const { error } = await sb.from(CONFIG.tabla).delete().eq('id', _deletingId);
  btn.disabled = false; btn.textContent = 'Eliminar';
  if (error) { showToast('Error al eliminar: ' + error.message, 'error'); return; }
  closeDeleteConfirm();
  showToast('Confirmación eliminada.');
  loadList(true);
}

function exportExcel() {
  if (!allRows.length) { showToast('No hay confirmaciones para exportar.'); return; }
  const header = ['Nombre', 'Cédula', 'Confirmado el'];
  const rows = allRows.map(r => {
    const fecha = r.created_at ? new Date(r.created_at).toLocaleString('es-CR') : '';
    return [r.nombre||'', r.cedula||'', fecha];
  });
  const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
  ws['!cols'] = [{ wch:34 }, { wch:14 }, { wch:20 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Participación');
  XLSX.writeFile(wb, CONFIG.archivoExcel);
}

// ── QR ── URL fija del formulario publicado en GitHub Pages.
(function renderQr() {
  document.getElementById('qr-url').textContent = CONFIG.formUrl;
  if (typeof QRCode === 'undefined') return;
  new QRCode(document.getElementById('qr-holder'), {
    text: CONFIG.formUrl, width: 160, height: 160,
    colorDark: '#7f1d1d', colorLight: '#ffffff'
  });
})();

// ── TIEMPO REAL ──
let _rtChannel = null;
let _rtReloadT = null;
function _rtScheduleReload() {
  clearTimeout(_rtReloadT);
  _rtReloadT = setTimeout(() => loadList(true), 800);
}
function startRealtime() {
  if (_rtChannel || !sb || !sb.channel) return;
  _rtChannel = sb.channel('rt-bota-navidena-playa')
    .on('postgres_changes', { event: '*', schema: 'public', table: CONFIG.tabla }, _rtScheduleReload)
    .subscribe();
}

loadList();
startRealtime();

// ── VIEWPORT ZOOM — pantallas angostas: en vez de recortar el nombre o
// generar scroll horizontal, se mide el ancho real que necesita la tabla
// y se achica el contenedor lo justo para que quepa (transform:scale,
// más predecible entre navegadores que la propiedad CSS "zoom").
function applyZoom() {
  const root = document.getElementById('zoom-root');
  if (!root) return;
  root.style.transform = '';
  root.style.width = '';
  root.style.marginBottom = '';
  requestAnimationFrame(() => {
    const wrap = document.querySelector('.table-wrap');
    const prevOverflow = wrap ? wrap.style.overflow : '';
    if (wrap) wrap.style.overflow = 'visible';
    const neededWidth = root.scrollWidth;
    const neededHeight = root.scrollHeight;
    if (wrap) wrap.style.overflow = prevOverflow;

    const vw = window.innerWidth;
    if (neededWidth > vw) {
      const scale = vw / neededWidth;
      root.style.transformOrigin = 'top left';
      root.style.transform = 'scale(' + scale.toFixed(4) + ')';
      root.style.width = neededWidth + 'px';
      root.style.marginBottom = (neededHeight * scale - neededHeight) + 'px';
    }
  });
}
window.addEventListener('resize', applyZoom);
applyZoom();
</script>

</body>
</html>
